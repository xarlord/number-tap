name: CI

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Verify coverage ≥ 60%
        run: ./gradlew koverVerify --console=plain

      - name: Generate coverage report
        if: always()
        run: ./gradlew koverHtmlReport --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/kover/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  tdd-enforcement:
    name: "🚦 TDD: Tests Required for Changes"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref || 'master' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check test presence for changed files
        run: |
          python scripts/test-enforcement/check-test-presence.py \
            --base ${{ github.base_ref || 'master' }} \
            --verbose

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  e2e-tests:
    name: "🧪 E2E Instrumented Tests"
    # Ubuntu is the supported GitHub-hosted runner for hardware-accelerated Android emulators.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM and verify acceleration
        run: |
          mkdir -p ci-artifacts/emulator
          echo "KVM setup on $(uname -a)" | tee ci-artifacts/emulator/kvm.txt
          echo "Runner: ${RUNNER_NAME:-unknown}" | tee -a ci-artifacts/emulator/kvm.txt
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if test -e /dev/kvm; then
            stat -c 'KVM device: %A %U %G %n' /dev/kvm | tee -a ci-artifacts/emulator/kvm.txt
            awk '/(vmx|svm)/ { flags++ } END { print "CPU virtualization flag count:", flags + 0 }' /proc/cpuinfo | tee -a ci-artifacts/emulator/kvm.txt
          else
            echo "KVM device /dev/kvm is unavailable" | tee -a ci-artifacts/emulator/kvm.txt
            exit 1
          fi

      - name: Run E2E instrumented tests (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain --stacktrace

      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts/emulator

          capture_command() {
            local output_file="$1"
            shift
            if timeout 30s "$@" >"$output_file" 2>&1; then
              return 0
            fi
            printf '\n[diagnostic command failed or timed out]\n' >>"$output_file"
          }

          capture_command ci-artifacts/emulator/adb-devices.txt adb devices -l
          if timeout 30s adb devices 2>/dev/null | awk 'NR > 1 && $2 == "device" { found = 1 } END { exit(found ? 0 : 1) }'; then
            capture_command ci-artifacts/emulator/getprop.txt adb shell getprop
            capture_command ci-artifacts/emulator/dumpsys-activity.txt adb shell dumpsys activity activities
            capture_command ci-artifacts/emulator/dumpsys-window.txt adb shell dumpsys window
            capture_command ci-artifacts/emulator/logcat.txt adb logcat -d -t 2000
          else
            printf 'No ready ADB device was available for emulator diagnostics.\n' > ci-artifacts/emulator/diagnostic-status.txt
          fi

      - name: Upload E2E failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/androidTest/
            app/build/outputs/androidTest-results/
            ci-artifacts/emulator/
